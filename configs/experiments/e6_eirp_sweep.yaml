# Experiment 6 - sensitivity of the Delta T/T results to the EIRP assumptions.
#
# Each case overrides one or more systems' Ku user-downlink EIRP density (dBW/MHz)
# and selects the interferer beam-steering model.  The as-deployed CelesTrak
# snapshot is held fixed; replication is over independent simulation start times
# (constellation fixed).  Cases:
#
#   primary              Starlink EIRP ceiling +16.0018 dBW/MHz, which places the
#                        PFD-constant operation exactly at the 25.208(b) limit
#                        (-116 dBW/m^2/MHz for 25-90 deg); OneWeb +10.6
#                        (Del Portillo 2019, Table 3); steering: config ->
#                        Starlink PFD-constant (primary), OneWeb constant-EIRP
#                        (ASSUMED).  Cross-check: the unit-corrected top of the
#                        filed range (15.68 dBW/MHz) gives -116.32, 0.3 dB below
#                        the limit.
#   starlink_low_end     Starlink at the low end of the filed 4-kHz range
#                        (-11.9 dBW/4kHz = +12.1 dBW/MHz).
#   delportillo_common   both systems from Del Portillo 2019 (Starlink +12.7).
#   oneweb_cn_calibrated OneWeb at the earlier C/N-target calibration (+0.2),
#                        retained only as a sensitivity row (not a design rule).
#   starlink_constant_eirp the primary EIRPs with Starlink forced to
#                        constant-EIRP steering (the constant-EIRP sensitivity).
#   starlink_pfd_minus3  PFD-constant Starlink with its PFD 3 dB below the
#                        25.208(b) anchor (EIRP_max 16.0018 - 3 = 13.0018).
#   starlink_gen1_design Starlink Gen1 filed design point: constant PFD
#                        -146 dB(W/m^2/4kHz) = -122.02 dB(W/m^2/MHz), SpaceX
#                        SAT-LOA-20161115-00118 Technical Attachment Table A.7-1;
#                        6.02 dB below the 25.208(b) limit, so EIRP_max =
#                        16.0018 - 6.0206 = 9.9812 dBW/MHz (same 25 deg anchor).
#   noise_assumed        the earlier ASSUMED terminal noise temperatures
#                        (OneWeb 200 K, Starlink 150 K) instead of the
#                        del Portillo primary values; sensitivity row.
#   oneweb_min_elev_55   OneWeb minimum service elevation 55 deg (del Portillo
#                        et al., Sec. 2.2) instead of the ASSUMED common 25 deg;
#                        applies to OneWeb's own visibility in both directions.
name: e6_eirp_sweep
description: >
  Sensitivity of both ordered co-frequency user-downlink Delta T/T exceedance
  fractions and the qualified 25.261(d) throughput degradation to the EIRP
  assumptions: the FCC unit-corrected Starlink value, the low end of the filed
  range, a single common (Del Portillo) source for both systems, the retired
  C/N-calibrated OneWeb value, and PFD-constant (primary) vs constant-EIRP
  Starlink beam steering.
constellations: [STARLINK, ONEWEB]
stations: stations.yaml
seed: 0
params:
  n_start_times: 4          # independent start times (fewer than E5 to bound runtime)
  start_offset_s: 18000     # 5 h ASSUMED, as in E5
  time_step_s: 10
  duration_s: 86400
  chunk: 64
  thetas_deg: [5.0]
  tle_cache_dir: data/raw/tle
  tle_groups:
    STARLINK: starlink
    ONEWEB: oneweb
  operational_altitude_km:
    STARLINK: [450, 600]
    ONEWEB: [1100, 1300]
  cases:
    - name: primary
      eirp_dbw_per_mhz: {STARLINK: 16.0018, ONEWEB: 10.6}
      steering: config
    - name: starlink_low_end
      eirp_dbw_per_mhz: {STARLINK: 12.1, ONEWEB: 10.6}
      steering: config
    - name: delportillo_common
      eirp_dbw_per_mhz: {STARLINK: 12.7, ONEWEB: 10.6}
      steering: config
    - name: oneweb_cn_calibrated
      eirp_dbw_per_mhz: {STARLINK: 16.0018, ONEWEB: 0.2}
      steering: config
    - name: starlink_constant_eirp
      eirp_dbw_per_mhz: {STARLINK: 16.0018, ONEWEB: 10.6}
      steering: constant_eirp
    # PFD sensitivity: lower the *PFD-constant* Starlink PFD by 3 dB and 6 dB
    # relative to the 25.208(b)-anchored value (the -6 dB point is the sourced
    # Gen1 design PFD, starlink_gen1_design).  Under PFD-constant steering the
    # PFD is EIRP_max - spreading(r_max), so reducing EIRP_max by 3/6 dB lowers the
    # modelled Starlink PFD by exactly 3/6 dB (anchor unchanged).
    - name: starlink_pfd_minus3
      eirp_dbw_per_mhz: {STARLINK: 13.0018, ONEWEB: 10.6}
      steering: config
    - name: starlink_gen1_design
      eirp_dbw_per_mhz: {STARLINK: 9.9812, ONEWEB: 10.6}
      steering: config
    - name: noise_assumed
      eirp_dbw_per_mhz: {STARLINK: 16.0018, ONEWEB: 10.6}
      noise_temp_k: {STARLINK: 150.0, ONEWEB: 200.0}
      steering: config
    - name: oneweb_min_elev_55
      eirp_dbw_per_mhz: {STARLINK: 16.0018, ONEWEB: 10.6}
      min_elevation_deg: {ONEWEB: 55.0}
      steering: config
  source: ASSUMED
