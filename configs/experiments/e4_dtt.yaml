# Experiment 4 - 47 CFR 25.261(d) Delta T/T link-budget screening.
name: e4_dtt
description: >
  Replace the geometric in-line proxy with the regulatory power criterion:
  aggregate Delta T/T > 0.06 (I/N > -12.2 dB) for the co-frequency user-downlink
  pairs, using the shared-band centre frequency, the ITU-R S.1428/S.465 receive
  pattern at the off-axis angle between serving and interfering satellites, and
  the victim system noise temperature.  Reports the event / unresolvable time
  fraction and the 25.261(d) throughput degradation vs latitude, for both
  interferer variants and a sweep of ASSUMED terminal apertures.
constellations: [STARLINK, KUIPER, ONEWEB]
stations: stations.yaml
seed: 0
params:
  n_phasings: 8            # independent constellation phasings (unit of replication)
  time_step_s: 10          # propagation / detection sampling step
  duration_s: 86400        # simulated window (24 h)
  chunk: 64                # time-chunk size for the batched GPU pipeline
  # Interferer beam-steering model: null/config = per-beam (STARLINK PFD-constant
  # is the primary Ku model, ONEWEB constant-EIRP ASSUMED); "constant_eirp" or
  # "pfd_constant" force one model for the sensitivity runs.
  steering: config
  # Diversity path-loss: "interferer" (station->interferer range, correct);
  # "victim" reproduces the earlier victim-range approximation for attribution.
  diversity_fspl: interferer
  # Starlink shells forming the STARLINK system (Phase 4): gen2 = the FCC 22-91
  # Gen2 shells (the 2020-round system tested against 25.261(d)); gen1 / all are
  # the Gen1-only and combined sensitivity runs (--starlink-generation).  Gen2
  # claims rest on the AS-DEPLOYED Gen2-only result (E5/E6); this as-filed run is
  # the comparison.
  starlink_generation: gen2
  # Satellite-diversity (handoff) policies evaluated on the same geometry; see
  # ngsi.dtt_screen (module docstring) for the definition.  `primary_handoff`
  # feeds the degradation_div / unavail_incr_div_frac columns; all policies go to
  # raw_handoff.parquet / summary_handoff.csv.  k and min_interval_s: ASSUMED
  # constraint values (K = 2, 3 highest-elevation candidates; at most one switch
  # per 10 s / 60 s).
  handoff_policies:
    - {name: full, link_cn: candidate}
    - {name: full_keep_serving, link_cn: candidate, keep_serving_if_better: true}
    - {name: legacy, link_cn: serving}
    - {name: full_k2, link_cn: candidate, k: 2}
    - {name: full_k3, link_cn: candidate, k: 3}
    - {name: full_n10, link_cn: candidate, min_interval_s: 10}
    - {name: full_n60, link_cn: candidate, min_interval_s: 60}
  primary_handoff: full
  source: ASSUMED
