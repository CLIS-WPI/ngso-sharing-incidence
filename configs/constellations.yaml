# NGSO constellation parameters.
#
# RULE (AGENTS.md rule 2): every physical parameter MUST carry a `source:` that is
# either a filing / literature reference or the literal string ASSUMED. Config
# validation requires the key on every shell and every beam.
#
# A "system" is ALL shells of one operator. In-line events are only ever computed
# BETWEEN different systems (never between shells of the same operator).
#
# Orbital parameters verified against:
#   Starlink - Pachler, Mutter, Behar et al. 2021, "An Updated Comparison of Four
#              LEO Satellite Constellation Systems", Table II (FCC-derived).
#   Kuiper   - Amazon Kuiper FCC Technical Appendix, SAT-LOA-20190704-00057 (2019).
#   OneWeb   - altitude/inclination: FCC DA-23-362; the 18x36 plane layout is
#              UNVERIFIED (filings give 18x40 originally, or 12x49+8x16 revised),
#              so it is tagged ASSUMED (from prompt).
# No operator states a Walker phasing factor F; every F defaults to 1 (ASSUMED).
#
# Earth model: SPHERICAL, R = 6371 km, used for station positions, visibility caps
# and orbital radius bookkeeping. This is a modelling choice, tagged ASSUMED.

earth_model:
  shape: spherical
  radius_km: 6371.0
  source: ASSUMED (spherical earth model specified in Phase-2 prompt)

# Fixed GMST epoch for all propagation (store here so runs are reproducible).
epoch:
  utc: "2025-01-01T00:00:00Z"
  source: ASSUMED (arbitrary fixed epoch; GMST computed from it)

constellations:
  # ------------------------------------------------------------------ Starlink
  - name: STARLINK
    operator: SpaceX
    shells:
      - name: STARLINK-s1-550-53
        altitude_km: 550.0
        inclination_deg: 53.0
        planes: 72
        sats_per_plane: 22
        phasing_f: 1
        source: Pachler et al. 2021 Table II (FCC-derived)
        beam: &beam_starlink
          peak_gain_dbi: 44.0
          beamwidth_deg: 1.1
          eirp_density_dbw_per_mhz: -8.3
          freq_ghz: 12.0
          bandwidth_mhz: 240.0
          system_noise_temp_k: 150.0
          source: >-
            WORST-CASE (max) convention. peak_gain_dbi: SpaceX Gen2 Ku-band
            maximum antenna gain 44 dBi, FCC-22-91A1 (2022) para. 190.
            eirp_density_dbw_per_mhz: maximum Ku-band downlink EIRP density
            -8.3 dBW/MHz (top of the -11.9..-8.3 dBW/MHz range), FCC-22-91A1
            para. 191. beamwidth_deg: DERIVED from the 44 dBi peak via
            HPBW ~ 70*lambda/D (aperture efficiency 0.6, ASSUMED); no filing
            states the satellite beamwidth. freq_ghz: centre of the Ku-band user
            downlink 10.7-12.7 GHz. bandwidth_mhz: Starlink Ku channel, emission
            designator 240MD7W (SpaceX FCC filings). system_noise_temp_k:
            ASSUMED terminal value.
      - name: STARLINK-s2-540-53
        altitude_km: 540.0
        inclination_deg: 53.2
        planes: 72
        sats_per_plane: 22
        phasing_f: 1
        source: Pachler et al. 2021 Table II (FCC-derived)
        beam: *beam_starlink
      - name: STARLINK-s3-570-70
        altitude_km: 570.0
        inclination_deg: 70.0
        planes: 36
        sats_per_plane: 20
        phasing_f: 1
        source: Pachler et al. 2021 Table II (FCC-derived)
        beam: *beam_starlink
      - name: STARLINK-s4-560-97-a
        altitude_km: 560.0
        inclination_deg: 97.6
        planes: 6
        sats_per_plane: 58
        phasing_f: 1
        source: Pachler et al. 2021 Table II (FCC Group 3; FCC-derived)
        beam: *beam_starlink
      - name: STARLINK-s4-560-97-b
        altitude_km: 560.0
        inclination_deg: 97.6
        planes: 4
        sats_per_plane: 43
        phasing_f: 1
        source: Pachler et al. 2021 Table II (FCC Group 5; FCC-derived)
        beam: *beam_starlink

  # -------------------------------------------------------------------- Kuiper
  - name: KUIPER
    operator: Amazon
    shells:
      - name: KUIPER-s1-630-51
        altitude_km: 630.0
        inclination_deg: 51.9
        planes: 34
        sats_per_plane: 34
        phasing_f: 1
        source: Kuiper FCC Technical Appendix 2019, SAT-LOA-20190704-00057
        beam: &beam_kuiper
          peak_gain_dbi: 35.0
          beamwidth_deg: 2.8
          eirp_density_dbw_per_mhz: -19.0
          freq_ghz: 19.8
          bandwidth_mhz: 500.0
          system_noise_temp_k: 200.0
          source: >-
            peak_gain_dbi / beamwidth_deg / freq_ghz: Kuiper experimental STA
            satellite user beam 35 dBi, 2.8 deg 3-dB spot beam at 19.8 GHz,
            apps.fcc.gov/els/GetAtt.html?id=347260 (19.6-20.1 GHz).
            eirp_density_dbw_per_mhz: ASSUMED (the STA gives total EIRP 36 dBW,
            not a per-MHz density). bandwidth_mhz: largest Kuiper emission
            designator 500MG7W (FCC). system_noise_temp_k: ASSUMED.
      - name: KUIPER-s2-610-42
        altitude_km: 610.0
        inclination_deg: 42.0
        planes: 36
        sats_per_plane: 36
        phasing_f: 1
        source: Kuiper FCC Technical Appendix 2019, SAT-LOA-20190704-00057
        beam: *beam_kuiper
      - name: KUIPER-s3-590-33
        altitude_km: 590.0
        inclination_deg: 33.0
        planes: 28
        sats_per_plane: 28
        phasing_f: 1
        source: Kuiper FCC Technical Appendix 2019, SAT-LOA-20190704-00057
        beam: *beam_kuiper

  # -------------------------------------------------------------------- OneWeb
  - name: ONEWEB
    operator: Eutelsat OneWeb
    shells:
      - name: ONEWEB-s1-1200-87
        altitude_km: 1200.0
        inclination_deg: 87.9
        planes: 18
        sats_per_plane: 36
        phasing_f: 1
        source: >-
          ASSUMED (from prompt); altitude/inclination per FCC DA-23-362, but the
          18x36 plane layout is UNVERIFIED (filings give 18x40 or 12x49+8x16)
        beam:
          peak_gain_dbi: 30.0
          beamwidth_deg: 3.0
          eirp_density_dbw_per_mhz: 0.2
          freq_ghz: 12.0
          bandwidth_mhz: 125.0
          system_noise_temp_k: 200.0
          source: >-
            ASSUMED (calibrated). OneWeb user-beam peak gain / beamwidth remain
            ASSUMED (no citable per-beam value; FCC-17-77 only references binary
            Ku/Ka antenna-gain mask files). The EIRP density is calibrated in this
            model's own scale by scripts/calibrate_oneweb_eirp.py: the value that
            gives a time-median clear-sky C/N of 5 dB (target band 4-6 dB) for the
            0.6 m reference terminal at 45 deg in the shared Ku user downlink, so
            the OneWeb link closes with positive margin (baseline availability
            ~100%). Absolute public values disagree by >10 dB and mix per-beam,
            per-MHz and PFD quantities (Eutelsat/OneWeb ITU-submitted analysis,
            FCC IBFS SAT-MOD-20181108-00083, gives +10.6 dBW/MHz; Del Portillo et
            al. 2019 give ~+10.6 dBW/MHz for OneWeb vs ~+12.7 dBW/MHz for Starlink
            from the same FCC filings, ~2 dB apart), so no single public value is
            imported. Ku-band downlink is nominally 10.7-12.7 GHz.
