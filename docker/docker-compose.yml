# Run with:  docker compose -f docker/docker-compose.yml <cmd>
# Relative paths are resolved against this file's directory (docker/).
services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    image: ngsi-dev:latest
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command: sleep infinity
